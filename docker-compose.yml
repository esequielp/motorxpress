version: '3.8'

services:
  web_app:
    build:
      context: .
      args:
        # Variables pasadas al compilador frontend para personalizar el "White-label"
        VITE_APP_NAME: "Ferretería Central"
        VITE_THEME: "corporate" # Valores posibles: racing, marketplace, corporate, modern, minimalism
    image: ecommerce_whitelabel_app
    container_name: ferreteria_ecommerce
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      # - GEMINI_API_KEY=your_key_here
    volumes:
      - ./uploads:/app/uploads
      - ./data:/app/data # Se recomienda montar la base de datos fuera
      
  # postgres:
  #   image: postgres:15-alpine
