  #     POSTGRES_USER: ecommerce_admin
  #     POSTGRES_PASSWORD: ecommerce_password
  #     POSTGRES_DB: ecommerce_db
  #   volumes:
  #     - pgdata:/var/lib/postgresql/data
  #   ports:
  #     - "5432:5432"

volumes:
  pgdata:
